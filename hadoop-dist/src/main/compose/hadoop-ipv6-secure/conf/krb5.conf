# krb5 client + KDC configuration for the IPv6-only secure Hadoop harness.

[libdefaults]
    default_realm = IPV6.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # Do NOT canonicalize service hosts via reverse DNS. The compose network
    # has no PTR records for the ULA IPv6 addresses; principals are built from
    # the configured (forward-resolvable) hostnames, so rdns must be off.
    rdns = false
    # Forward AAAA lookups of "kdc"/"namenode"/etc. are what we rely on.
    forwardable = true
    # Force TCP so a large IPv6 UDP path / fragmentation never bites us.
    udp_preference_limit = 1
    ticket_lifetime = 24h
    renew_lifetime = 7d

[realms]
    IPV6.TEST = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .ipv6.test = IPV6.TEST
    ipv6.test = IPV6.TEST

[logging]
    kdc = STDERR
    admin_server = STDERR
    default = STDERR
