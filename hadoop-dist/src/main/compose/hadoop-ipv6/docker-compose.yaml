#
# IPv6-only Hadoop verification harness for the changes on dev/ipv6-only.
#
# Network: a user-defined bridge with IPv6 enabled and a ULA subnet.
# Docker still requires an IPv4 subnet on user-defined bridges, so a tiny
# 169.254 link-local v4 range is provided alongside; Hadoop services
# bind/advertise IPv6 only.
#
# Build prerequisite (run from the repo root):
#     mvn -DskipTests -Pdist package
# That produces hadoop-dist/target/hadoop-3.6.0-SNAPSHOT/. Then:
#     cd hadoop-dist/src/main/compose/hadoop-ipv6
#     cp -r ../../../target/hadoop-3.6.0-SNAPSHOT .
#     docker compose build
#     docker compose up -d
#     docker compose exec namenode /opt/hadoop/smoketest.sh
#
# (Or use the build-arg form documented in README.md.)

services:
  namenode:
    build:
      context: .
      dockerfile: Dockerfile
    image: hadoop-ipv6:dev
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::10
    volumes:
      - nn-data:/data/dfs/name

  datanode-1:
    image: hadoop-ipv6:dev
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::21
    volumes:
      - dn1-data:/data/dfs/data

  datanode-2:
    image: hadoop-ipv6:dev
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::22
    volumes:
      - dn2-data:/data/dfs/data

  resourcemanager:
    image: hadoop-ipv6:dev
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
    ports:
      - "8088:8088"
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::30

  nodemanager-1:
    image: hadoop-ipv6:dev
    hostname: nodemanager-1
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::41

  historyserver:
    image: hadoop-ipv6:dev
    hostname: historyserver
    command: ["mapred", "historyserver"]
    depends_on:
      - namenode
    ports:
      - "19888:19888"
    networks:
      v6net:
        ipv6_address: fd00:dead:beef::50

networks:
  v6net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef::/64
        - subnet: 169.254.99.0/27

volumes:
  nn-data:
  dn1-data:
  dn2-data:
