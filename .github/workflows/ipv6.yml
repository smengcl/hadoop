# IPv6 coverage. Two jobs:
#   * unit-tests   - runs the IPv6-focused unit/integration tests under the
#                    `ipv6-test` Maven profile (which flips the surefire JVM to
#                    dual-stack with an IPv6 preference; the default build pins
#                    java.net.preferIPv4Stack=true, masking Inet6Address paths).
#                    This is the PR/push gate: fast and reliable on the
#                    GitHub-hosted runner (IPv6 loopback is available even where
#                    outbound IPv6 is not).
#   * compose-smoketest - opt-in (workflow_dispatch) end-to-end run of the
#                    docker-compose IPv6-only cluster. It builds the dist and
#                    runs hadoop-ipv6/smoketest.sh. It enables IPv6 on the
#                    Docker daemon first (user-defined bridge networks with a
#                    ULA subnet stay on-host, so no outbound IPv6 is required).
#                    Kept manual because the full dist build is expensive and
#                    Docker IPv6 is not on by default on hosted runners.

name: "IPv6"

# NOTE: GitHub Actions does not support YAML anchors/aliases, so the push and
# pull_request path filters are duplicated verbatim - keep them in sync.
on:
  push:
    paths:
      - '.github/workflows/ipv6.yml'
      - 'hadoop-project/pom.xml'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/net/**'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/security/**'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/ipc/**'
      - 'hadoop-hdfs-project/**/src/main/java/org/apache/hadoop/hdfs/**'
      - '**/*IPv6*.java'
      - '**/*Ipv6*.java'
      - 'hadoop-dist/src/main/compose/hadoop-ipv6/**'
  pull_request:
    paths:
      - '.github/workflows/ipv6.yml'
      - 'hadoop-project/pom.xml'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/net/**'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/security/**'
      - 'hadoop-common-project/hadoop-common/src/main/java/org/apache/hadoop/ipc/**'
      - 'hadoop-hdfs-project/**/src/main/java/org/apache/hadoop/hdfs/**'
      - '**/*IPv6*.java'
      - '**/*Ipv6*.java'
      - 'hadoop-dist/src/main/compose/hadoop-ipv6/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Include the event name so a manual workflow_dispatch run does not cancel an
  # in-flight push/PR gate run (and vice versa) on the same ref.
  group: ipv6-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  MVN_ARGS: --batch-mode --no-transfer-progress -Dmaven.javadoc.skip=true
  # Modules whose main code carries IPv6 address-handling logic and IPv6 tests.
  IPV6_MODULES: >-
    hadoop-common-project/hadoop-common,hadoop-hdfs-project/hadoop-hdfs-client,hadoop-hdfs-project/hadoop-hdfs,hadoop-hdfs-project/hadoop-hdfs-rbf
  # IPv6-focused test classes. A simple class name matches only in the module
  # that defines it, so one list works across all -pl modules.
  IPV6_TESTS: >-
    TestNetUtilsIPv6,TestDNSReverseIPv6,TestSecurityUtilIPv6,TestSecurityUtilTokenServiceIPv6,TestRPCIPv6,TestChecksumFileSystemColons,TestWebHdfsURLIPv6,TestDelegationTokenIdentifierIPv6,TestDatanodeIDIPv6,TestDFSUtil,TestMiniDFSClusterIPv6,TestBlockTokenIPv6,TestNameNodeGenericKeysIPv6,TestDatanodeManagerIPv6Registration,TestGetConf,TestHDFSServerPorts,TestStateStoreUtils

jobs:
  unit-tests:
    name: IPv6 unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [17]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build IPv6 modules (skip tests)
        shell: bash
        run: |
          ./mvnw $MVN_ARGS -pl "$IPV6_MODULES" -am install -DskipTests
      - name: Run IPv6 tests (-Pipv6-test)
        shell: bash
        run: |
          ./mvnw $MVN_ARGS -Pipv6-test -pl "$IPV6_MODULES" \
            -Dtest="$IPV6_TESTS" -DfailIfNoTests=false test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipv6-surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  compose-smoketest:
    name: IPv6 docker-compose smoke test
    # Opt-in only: expensive dist build + Docker IPv6 setup.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: 'maven'
      - name: Enable IPv6 on the Docker daemon
        shell: bash
        run: |
          # User-defined bridge networks with enable_ipv6 + a ULA subnet need
          # the daemon's ip6tables support. The compose file declares its own
          # subnet, so fixed-cidr-v6 here only seeds the default bridge.
          sudo mkdir -p /etc/docker
          echo '{ "experimental": true, "ip6tables": true, "ipv6": true, "fixed-cidr-v6": "fd00:cafe::/64" }' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker network create --ipv6 --subnet fd00:beef::/64 v6probe \
            && docker network rm v6probe \
            && echo "Docker IPv6 networking OK"
      - name: Build distribution
        shell: bash
        run: |
          ./mvnw $MVN_ARGS -Pdist -DskipTests -pl hadoop-dist -am package
      - name: Stage dist and start the IPv6 cluster
        shell: bash
        working-directory: hadoop-dist/src/main/compose/hadoop-ipv6
        run: |
          cp -r "$GITHUB_WORKSPACE/hadoop-dist/target/hadoop-3.6.0-SNAPSHOT" .
          docker compose build
          docker compose up -d
          docker compose ps
      - name: Wait for HDFS and run the smoke test
        shell: bash
        working-directory: hadoop-dist/src/main/compose/hadoop-ipv6
        run: |
          # Give the NameNode/DataNodes time to register, then run the in-container
          # smoke test (put/get/report/JMX/WordCount over IPv6).
          timeout 300 bash -c '
            until docker compose exec -T namenode hdfs dfsadmin -safemode wait >/dev/null 2>&1; do
              echo "waiting for namenode..."; sleep 5;
            done'
          docker compose exec -T namenode /opt/hadoop/smoketest.sh
      - name: Dump logs on failure
        if: failure()
        shell: bash
        working-directory: hadoop-dist/src/main/compose/hadoop-ipv6
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        shell: bash
        working-directory: hadoop-dist/src/main/compose/hadoop-ipv6
        run: docker compose down -v || true
